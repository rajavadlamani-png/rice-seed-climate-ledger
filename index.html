<script>
function farmerQuickCalculate(){
  const area = Math.max(0, Number(document.getElementById('fqArea').value)||0);
  const days = Math.max(0, Number(document.getElementById('fqDays').value)||0);
  const urea = Math.max(0, Number(document.getElementById('fqUrea').value)||0);
  const dap = Math.max(0, Number(document.getElementById('fqDAP').value)||0);
  const otherN = Math.max(0, Number(document.getElementById('fqOtherN').value)||0);
  const seedT = Math.max(0, Number(document.getElementById('fqSeed').value)||0);
  const water = document.getElementById('fqWater').value;

  if(area<=0 || days<=0 || seedT<=0){
    document.getElementById('farmerResult').innerHTML =
      '<h2>Your ANVORA result</h2><p class="warn">Please enter positive values for area, crop duration and finished saleable seed.</p>';
    return;
  }

  // Prototype-only factors. These are intentionally aligned with the current
  // ANVORA prototype engine and are not certification factors.
  const ch4Base = 120 * area;
  const waterMult = {continuous:1.00, intermittent:0.80, awd:0.65, rainfed:0.55, unknown:1.00}[water] ?? 1.00;
  const ch4 = ch4Base * waterMult * 27.2 / 1000;

  const nKg = urea*0.46 + dap*0.18 + otherN*0.46;
  const n2oN = nKg * 0.01;
  const n2o = n2oN * (44/28) * 273 / 1000;

  const energy = area * 18 * 0.7 / 1000;
  const post = seedT * 45 / 1000;
  const total = ch4 + n2o + energy + post;
  const intensity = total * 1000 / (seedT * 1000);

  const result = document.getElementById('farmerResult');
  result.innerHTML =
    '<h2>Your ANVORA result</h2>' +
    '<div class="grid">' +
      '<div><strong>Total footprint</strong><br><span class="metric">'+total.toFixed(2)+' tCO₂e</span></div>' +
      '<div><strong>Intensity</strong><br><span class="metric">'+intensity.toFixed(4)+' kg CO₂e/kg finished seed</span></div>' +
      '<div><strong>Farm area</strong><br>'+area.toFixed(2)+' ha</div>' +
      '<div><strong>Finished seed</strong><br>'+seedT.toFixed(2)+' t</div>' +
    '</div>' +
    '<p><strong>Hotspots:</strong> CH₄ '+(ch4/total*100).toFixed(1)+'% · N₂O '+(n2o/total*100).toFixed(1)+'% · Energy '+(energy/total*100).toFixed(1)+'% · Post-harvest '+(post/total*100).toFixed(1)+'%</p>' +
    '<p class="muted">Status: Provisional prototype estimate. Water-regime and emission factors are illustrative defaults and should not be treated as certified carbon accounting.</p>';
}


function refreshExecutiveViews(){
  try{
    const plots = (window.S && Array.isArray(S.plots)) ? S.plots : [];
    const lots = (window.S && Array.isArray(S.lots)) ? S.lots : [];
    const calc = (window.S && S.calc) ? S.calc : null;

    const area = plots.reduce((a,p)=>a+(Number(p.area_ha)||0),0);
    const seed = lots.reduce((a,l)=>a+(Number(l.finished_seed_t)||0),0);
    const evidence = plots.length ? plots.filter(p=>String(p.evidence_id||'').trim()).length/plots.length*100 : 0;
    const critical = plots.filter(p=>!String(p.evidence_id||'').trim()).length;
    const review = plots.filter(p=>!(Number(p.area_ha)>0) || !(Number(p.crop_days)>0)).length;

    const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
    set('auditDataset', plots.length ? 'Loaded' : 'Not loaded');
    set('auditEvidence', plots.length ? evidence.toFixed(1)+'%' : '—');
    set('auditMass', lots.length ? 'See validation' : '—');
    set('auditMRV', calc ? 'Calculated / review required' : '—');

    set('acDataset', plots.length ? 'PASS' : 'REVIEW');
    set('acLinkage', lots.length && plots.length ? 'REVIEW' : 'REVIEW');
    set('acMass', lots.length ? 'REVIEW' : 'REVIEW');
    set('acEvidence', plots.length && evidence>=90 ? 'PASS' : (plots.length ? 'REVIEW' : '—'));
    set('acMethod', 'Controlled');
    set('acRun', calc && calc.runId ? 'PASS' : '—');

    const ex=[];
    if(plots.length && evidence<100) ex.push('Evidence missing or incomplete for '+Math.round(100-evidence)+'% of plot records.');
    if(review) ex.push(review+' plot record(s) require area/crop-duration review.');
    if(!lots.length) ex.push('No lot records are currently loaded.');
    document.getElementById('auditExceptions').innerHTML =
      ex.length ? '<ul>'+ex.map(x=>'<li>'+x+'</li>').join('')+'</ul>' :
      '<p> No current prototype exceptions detected by the dashboard checks.</p>';

    set('misFarmers', plots.length ? plots.length : '—');
    set('misArea', plots.length ? area.toFixed(2)+' ha' : '—');
    set('misSeed', seed ? seed.toFixed(2)+' t' : '—');
    set('misTotal', calc ? (calc.total/1000).toFixed(2)+' tCO₂e' : '—');
    set('misIntensity', calc ? calc.intensity.toFixed(4)+' kg CO₂e/kg' : '—');
    set('misEvidence', plots.length ? evidence.toFixed(1)+'%' : '—');
    set('misCritical', critical);
    set('misReview', review);
    set('misMRV', calc ? 'Review required' : '—');
    set('misRun', calc && calc.runId ? calc.runId : '—');

    if(calc){
      const total=calc.total||1;
      document.getElementById('misHotspots').innerHTML =
        '<ul>'+
        '<li>CH₄: '+((calc.ch4/total)*100).toFixed(1)+'%</li>'+
        '<li>N₂O: '+((calc.n2o/total)*100).toFixed(1)+'%</li>'+
        '<li>Energy: '+((calc.energy/total)*100).toFixed(1)+'%</li>'+
        '<li>Post-harvest: '+((calc.post/total)*100).toFixed(1)+'%</li>'+
        '</ul>';
      document.getElementById('misActions').innerHTML =
        '<ul>'+
        (evidence<100?'<li><strong>Evidence:</strong> close evidence gaps before relying on the dataset for formal review.</li>':'')+
        (review?'<li><strong>Data quality:</strong> resolve area/crop-duration exceptions.</li>':'')+
        '<li><strong>Climate:</strong> review the largest calculated source before selecting any intervention scenario.</li>'+
        '</ul>';
    }
  }catch(e){}
}


function anvoraExportRows(sectionId){
  const s=document.getElementById(sectionId); const rows=[];
  if(!s)return rows;
  s.querySelectorAll("table tr").forEach(tr=>{
    const a=[...tr.querySelectorAll("th,td")].map(x=>x.innerText.trim());
    if(a.length)rows.push(a);
  });
  return rows;
}
function anvoraDownloadText(text,name){
  const blob=new Blob([text],{type:"text/plain;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function anvoraExcel(rows,name){
  if(!window.XLSX){alert("Excel export requires the workbook library to be available.");return;}
  const wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb,ws,"ANVORA Report");XLSX.writeFile(wb,name);
}
function exportLeadershipExcel(){
  if(!window.XLSX){alert("Excel export requires the workbook library to be available.");return}
  const wb=XLSX.utils.book_new();
  const summary=[["ANVORA Leadership MIS"],["Generated",new Date().toLocaleString()],
    ["Area covered",document.getElementById("misArea")?.innerText||"—"],
    ["Finished seed",document.getElementById("misSeed")?.innerText||"—"],
    ["Total footprint",document.getElementById("misTotal")?.innerText||"—"],
    ["Intensity",document.getElementById("misIntensity")?.innerText||"—"],
    ["Evidence coverage",document.getElementById("misEvidence")?.innerText||"—"],
    ["Critical exceptions",document.getElementById("misCritical")?.innerText||"—"],
    ["Review items",document.getElementById("misReview")?.innerText||"—"],
    ["Calculation run",document.getElementById("misRun")?.innerText||"—"]];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(summary),"Executive Summary");
  const rows=plotEmissionRows();
  const geo=aggregateRows(rows,"state").sort((a,b)=>b.totalT-a.totalT);
  const hybrid=aggregateRows(rows,"hybrid").sort((a,b)=>b.totalT-a.totalT);
  const geoRows=[["State","Area ha","Finished seed t","Total tCO2e","kg CO2e/kg","kg CO2e/ha","Evidence %"],...geo.map(x=>[x.name,x.area,x.finished/1000,x.totalT,x.intensity,x.areaIntensity,x.evidencePct])];
  const hyRows=[["Hybrid / Variety","Area ha","Finished seed t","Total tCO2e","kg CO2e/kg","kg CO2e/ha","Evidence %"],...hybrid.map(x=>[x.name,x.area,x.finished/1000,x.totalT,x.intensity,x.areaIntensity,x.evidencePct])];
  const detRows=[["Plot","Lot","State","District","Hybrid","Water regime","Area ha","Finished seed kg","Total kg CO2e","kg CO2e/kg","kg CO2e/ha","Evidence","Modeled reduction proxy kg"],...rows.map(r=>[r.plot,r.lot,r.state,r.district,r.hybrid,r.water,r.area,r.finished,r.totalKg,r.finished?r.totalKg/(r.finished*1000):0,r.area?r.totalKg/r.area:0,r.evidence?"Present":"Missing",r.reductionKg])];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(geoRows),"State");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(hyRows),"Hybrid");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(detRows),"Plot Detail");
  XLSX.writeFile(wb,"ANVORA_Leadership_MIS.xlsx");
}
function exportAuditorExcel(){
  if(!window.XLSX){alert("Excel export requires the workbook library to be available.");return}
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["ANVORA Auditor / Verifier Review"],["Generated",new Date().toLocaleString()],[],...anvoraExportRows("auditChecklist")]),"Controls");
  const rows=plotEmissionRows();
  const scr=[["Plot","State","District","Hybrid","Water regime","Evidence","Screen status","Baseline proxy tCO2e","Project tCO2e","Gross reduction proxy tCO2e","Additionality","Leakage","Uncertainty deduction"],...rows.map(r=>{
    const has=!!r.evidence, improved=/awd|multiple drainage|single drainage|intermittent/i.test(r.water);
    const status=has&&improved&&r.area>0&&r.days>0?"Potentially applicable":(r.area<=0||r.days<=0||!has?"Review required":"Not applicable on current screen");
    return [r.plot,r.state,r.district,r.hybrid,r.water,has?"Present":"Missing",status,r.baseKg/1000,r.totalKg/1000,r.reductionKg/1000,"Not assessed","Not assessed","Not assessed"];
  })];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(scr),"Methodology Screen");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["Plot","Lot","State","District","Hybrid","Area ha","Finished seed kg","Evidence","Total kg CO2e"],...rows.map(r=>[r.plot,r.lot,r.state,r.district,r.hybrid,r.area,r.finished,r.evidence?"Present":"Missing",r.totalKg])]),"Plot Evidence");
  XLSX.writeFile(wb,"ANVORA_Auditor_Review.xlsx");
}
function anvoraPDF(sectionId,title,file){
  if(!window.jspdf){alert("PDF library is unavailable. Use Print / Save PDF instead.");return;}
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:"pt",format:"a4"});
  doc.setFontSize(20);doc.text(title,40,48);
  doc.setFontSize(9);doc.text("ANVORA · Raja Vadlamani",40,65);
  let y=88;
  const s=document.getElementById(sectionId);
  [...s.querySelectorAll("h1,h2,h3,p,li")].slice(0,100).forEach(el=>{
    const t=el.innerText.replace(/\s+/g," ").trim();if(!t)return;
    const lines=doc.splitTextToSize(t,515);
    if(y+lines.length*12>800){doc.addPage();y=45}
    doc.setFontSize(el.matches("h1,h2,h3")?13:9);doc.text(lines,40,y);y+=Math.max(15,lines.length*11+4);
  });
  doc.save(file);
}

<script id="anvora-v44-sentinel1-processing">
(function(){
  function safeEsc(v){return String(v==null?'':v).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;','\'':'&#39;'}[m]));}
  function safeFmtDate(v){if(!v)return '—';const d=new Date(v);if(Number.isNaN(d.getTime()))return String(v);return d.toISOString().slice(0,16).replace('T',' ');}
  if (typeof window.esc !== 'function') window.esc = safeEsc;
  if (typeof window.fmtDate !== 'function') window.fmtDate = safeFmtDate;

  function selectedEOItem(){
    const obs = window.ANVORA_EO_OBSERVATION;
    if (obs && obs.acquisitionId) return {id:obs.acquisitionId,datetime:obs.acquisitionDateTime,bbox:obs.requestedBbox || obs.catalogueBbox || null,plotId:obs.plotId || 'UNASSIGNED'};
    const radio = document.querySelector('input[name="eoAcqSelect"]:checked');
    if (!radio) return null;
    const items = (window.ANVORA_LIVE_ACQUISITIONS && window.ANVORA_LIVE_ACQUISITIONS.response && Array.isArray(window.ANVORA_LIVE_ACQUISITIONS.response.items)) ? window.ANVORA_LIVE_ACQUISITIONS.response.items : [];
    const byValue = items.find(item => String(item.id) === String(radio.value));
    const byIndex = items[Number(radio.value)] || items[0] || null;
    return byValue || byIndex || null;
  }

  function acqPayload(){
    const obs = window.ANVORA_EO_OBSERVATION;
    if (obs) return {plotId:obs.plotId || 'UNASSIGNED',bbox:obs.requestedBbox || obs.catalogueBbox || null,collection:obs.productCollection || 'sentinel-1-grd'};
    const item = typeof window.selectedEOItem === 'function' ? window.selectedEOItem() : selectedEOItem();
    return {plotId:'UNASSIGNED',bbox:item && item.bbox ? item.bbox : null,collection:'sentinel-1-grd'};
  }

  function isoLocalToUtc(v){return v ? new Date(v).toISOString() : null;}
  function s1Evalscript(){return `//VERSION=3
function setup(){return {input:[{bands:["VV","VH","dataMask"]}],output:[{id:"backscatter",bands:2,sampleType:"FLOAT32"},{id:"dataMask",bands:1}]};}
function evaluatePixel(samples){return {backscatter:[samples.VV,samples.VH],dataMask:[samples.dataMask]};}`;}

  function selectedAcqForS1(){
    const o = window.ANVORA_EO_OBSERVATION;
    if (o && o.acquisitionId) return o;
    const item = typeof window.selectedEOItem === 'function' ? window.selectedEOItem() : selectedEOItem();
    if (!item) return null;
    const payload = typeof window.acqPayload === 'function' ? window.acqPayload() : acqPayload();
    return {plotId:payload.plotId || 'UNASSIGNED', acquisitionId:item.id, acquisitionDateTime:item.datetime, requestedBbox:payload.bbox};
  }

  function loadSelectedAcqIntoS1(){
    const o = selectedAcqForS1();
    if (!o) { alert('Select an acquisition in v4.3 first.'); return; }
    const d = o.acquisitionDateTime ? new Date(o.acquisitionDateTime) : new Date();
    const before = new Date(d.getTime() - 60000);
    const after = new Date(d.getTime() + 60000);
    const fmt = x => {
      const z = new Date(x);
      const p = n => String(n).padStart(2,'0');
      return z.getFullYear() + '-' + p(z.getMonth()+1) + '-' + p(z.getDate()) + 'T' + p(z.getHours()) + ':' + p(z.getMinutes());
    };
    const fromField = document.getElementById('s1From');
    const toField = document.getElementById('s1To');
    if (fromField) fromField.value = fmt(before);
    if (toField) toField.value = fmt(after);
    const status = document.getElementById('s1Status');
    if (status) status.innerHTML = '<div class="control-row"><div><b>Selected acquisition loaded</b><small>'+window.esc(o.acquisitionId || '—')+' · '+window.esc(window.fmtDate(o.acquisitionDateTime))+'</small></div><span class="pill">Linked</span></div>';
    if (typeof window.buildS1StatsRequest === 'function') window.buildS1StatsRequest();
    else buildS1StatsRequest();
  }

  function s1StatsPayload(){
    const o = selectedAcqForS1();
    const payload = typeof window.acqPayload === 'function' ? window.acqPayload() : acqPayload();
    const bbox = o && o.requestedBbox ? o.requestedBbox : payload.bbox;
    const from = isoLocalToUtc(document.getElementById('s1From').value);
    const to = isoLocalToUtc(document.getElementById('s1To').value);
    const coeff = document.getElementById('s1Coeff').value;
    const res = Math.max(10, Number(document.getElementById('s1Resolution').value || 10));
    const agg = document.getElementById('s1Agg').value;
    const orbit = document.getElementById('s1Orbit').value;
    const pol = document.getElementById('s1Pol').value;
    const dataFilter = {};
    if (orbit) dataFilter.orbitDirection = orbit;
    if (pol) dataFilter.polarization = pol;
    return {
      input:{bounds:{bbox:bbox,properties:{crs:'http://www.opengis.net/def/crs/EPSG/0/4326'}},data:[{type:'sentinel-1-grd',dataFilter,processing:{orthorectify:true,backCoeff:coeff}}]},
      aggregation:{timeRange:{from,to},aggregationInterval:{of:agg},evalscript:s1Evalscript(),resx:res,resy:res},
      calculations:{default:{statistics:{default:{percentiles:{k:[10,50,90]}}}}}
    };
  }

  function buildS1StatsRequest(){
    const p = s1StatsPayload();
    const out = {endpoint:'https://sh.dataspace.copernicus.eu/statistics/v1',method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:p};
    const requestEl = document.getElementById('s1Request');
    if (requestEl) requestEl.textContent = JSON.stringify(out, null, 2);
    const status = document.getElementById('s1Status');
    if (status) status.innerHTML = '<div class="control-row"><div><b>Processing request built</b><small>Statistical API contract generated for Sentinel-1 GRD VV/VH.</small></div><span class="pill">Ready</span></div><div class="control-row"><div><b>Execution boundary</b><small>Authentication must be handled by ANVORA backend or an explicitly configured OAuth client.</small></div><span class="pill">Protected</span></div>';
    window.ANVORA_S1_REQUEST = out;
    return out;
  }

  function fmtNum(v){return v==null?'—':Number(v).toFixed(5);}

  function renderS1Result(data, simulated){
    const box = document.getElementById('s1Output');
    if (!box) return;
    const intervals = Array.isArray(data && data.data) ? data.data : [];
    const rows=[];
    intervals.forEach((it, i) => {
      const out = it.outputs || {};
      const bands = out.backscatter && out.backscatter.bands ? out.backscatter.bands : {};
      const names = Object.keys(bands);
      const parts=[];
      names.forEach(n => {
        const st = bands[n] && bands[n].stats ? bands[n].stats : null;
        if (st) parts.push(n + ': mean ' + fmtNum(st.mean) + ' · sd ' + fmtNum(st.stDev) + ' · n ' + fmtNum(st.sampleCount));
      });
      rows.push('<div class="control-row"><div><b>Interval '+(i+1)+'</b><small>'+window.esc(it.interval && it.interval.from ? it.interval.from : '')+' → '+window.esc(it.interval && it.interval.to ? it.interval.to : '')+' · '+window.esc(parts.join(' | ') || 'Statistics returned')+'</small></div><span class="pill">'+(simulated ? 'Simulated' : 'Measured')+'</span></div>');
    });
    if (!rows.length) rows.push('<div class="control-row"><div><b>No statistics parsed</b><small>Inspect the raw response JSON or verify the backend contract.</small></div><span class="pill warn">Review</span></div>');
    box.innerHTML = rows.join('') + '<pre style="white-space:pre-wrap;background:#f6f8f6;padding:12px;border-radius:10px;border:1px solid #dce5df;overflow:auto;max-height:280px;margin-top:10px">'+window.esc(JSON.stringify(data, null, 2))+'</pre>';
    window.ANVORA_S1_RESULT = {simulated, data};
  }

  function simulateS1Stats(){
    const req = typeof window.buildS1StatsRequest === 'function' ? window.buildS1StatsRequest() : buildS1StatsRequest();
    const from = req.body.aggregation.timeRange.from;
    const to = req.body.aggregation.timeRange.to;
    const sim = {status:'SIMULATED', note:'Synthetic demonstration only — not an observation of the selected field.', data: []};
    sim.data.push({interval:{from:from,to:to},outputs:{backscatter:{bands:{VV:{stats:{min:0.012,max:0.210,mean:0.06124,stDev:0.02131,sampleCount:1248,noDataCount:12}},VH:{stats:{min:0.002,max:0.092,mean:0.01871,stDev:0.00822,sampleCount:1248,noDataCount:12}}}}}});
    if (typeof window.renderS1Result === 'function') window.renderS1Result(sim, true);
    else renderS1Result(sim, true);
    const status = document.getElementById('s1Status');
    if (status) status.innerHTML = '<div class="control-row"><div><b>Sandbox simulation completed</b><small>VV/VH values are synthetic and must not enter an evidence or calculation run.</small></div><span class="pill">Simulation</span></div>';
  }

  window.selectedEOItem = window.selectedEOItem || selectedEOItem;
  window.acqPayload = window.acqPayload || acqPayload;
  window.selectedAcqForS1 = window.selectedAcqForS1 || selectedAcqForS1;
  window.loadSelectedAcqIntoS1 = window.loadSelectedAcqIntoS1 || loadSelectedAcqIntoS1;
  window.s1StatsPayload = window.s1StatsPayload || s1StatsPayload;
  window.buildS1StatsRequest = window.buildS1StatsRequest || buildS1StatsRequest;
  window.renderS1Result = window.renderS1Result || renderS1Result;
  window.simulateS1Stats = window.simulateS1Stats || simulateS1Stats;
})();
</script>

<style id="anvora-v451-sidebar-fix">
/* v4.5.1: collapsible desktop navigation so processing workspace is never obscured. */
:root{--sidebar-collapsed:0px}
body.sidebar-collapsed{--sidebar:0px}
body.sidebar-collapsed nav{transform:translateX(-100%);box-shadow:none}
body.sidebar-collapsed header{left:0}
body.sidebar-collapsed main.wrap{margin-left:0}
body.sidebar-collapsed footer{margin-left:0}
.anvora-sidebar-toggle{position:fixed;left:calc(var(--sidebar) - 18px);top:96px;z-index:60;width:36px;height:36px;border:1px solid #cddbd5;border-radius:10px;background:#fff;color:#176b52;box-shadow:0 4px 14px rgba(18,52,42,.14);cursor:pointer;font-size:18px;font-weight:800;line-height:1}
body.sidebar-collapsed .anvora-sidebar-toggle{left:14px}
.anvora-sidebar-toggle:hover{background:#eaf5f0}
@media(max-width:850px){.anvora-sidebar-toggle{display:none}}
</style>
<script id="anvora-v451-sidebar-engine">
(function(){
  function install(){
    if(document.querySelector('.anvora-sidebar-toggle')) return;
    const btn=document.createElement('button');
    btn.className='anvora-sidebar-toggle';
    btn.type='button';
    btn.setAttribute('aria-label','Collapse ANVORA navigation');
    btn.title='Collapse / expand navigation';
    btn.textContent='‹';
    btn.addEventListener('click',()=>{
      const collapsed=document.body.classList.toggle('sidebar-collapsed');
      btn.textContent=collapsed?'›':'‹';
      btn.setAttribute('aria-label',collapsed?'Expand ANVORA navigation':'Collapse ANVORA navigation');
    });
    document.body.appendChild(btn);
    // Keep the full workspace visible by default on the Remote Connectors page.
    if(location.hash==='#connectors') document.body.classList.add('sidebar-collapsed'), btn.textContent='›';
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',install); else install();
})();
</script>

body.poc-connectors-active header{left:0}

</style>
<script id="anvora-v452-poc-ui-engine">
(function(){
  function setPOC(on){
    document.body.classList.toggle('poc-connectors-active', !!on);
    const b=document.querySelector('.anvora-sidebar-toggle');
    if(b){
      b.textContent=on?'›':'‹';
      b.setAttribute('aria-label',on?'Expand ANVORA navigation':'Collapse ANVORA navigation');
    }
  }
  function wire(){
    document.querySelectorAll('.secondary-nav button[data-page="connectors"]').forEach(b=>{
      b.addEventListener('click',()=>setTimeout(()=>setPOC(true),0));
    });
    document.querySelectorAll('.secondary-nav button:not([data-page="connectors"])').forEach(b=>{
      b.addEventListener('click',()=>setTimeout(()=>setPOC(false),0));
    });
    const active=document.querySelector('.secondary-nav button.active[data-page="connectors"]');
    if(active) setPOC(true);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',()=>setTimeout(wire,50));
  else setTimeout(wire,50);
})();
</script>

<div id="sentinel1Panel" class="card" style="max-width:1200px;margin:20px auto 0;padding:18px;">
  <div class="kicker">EO Observation</div>
  <h2>Sentinel-1 Processing</h2>
  <p class="muted">Uses the current EO acquisition selection and the existing Sentinel-1 request contract. This panel consumes the same observation state used by the EO workflow.</p>

  <div class="grid g2" style="margin-top:12px;">
    <div>
      <label>EO acquisition selection</label>
      <div id="eoAcqList" class="card" style="padding:12px 14px;background:#fafcfb;">
        <div class="muted">No acquisition data loaded yet.</div>
      </div>
      <div class="actions" style="margin-top:10px;">
        <button id="s1CreateObservationBtn" class="btn secondary" type="button">Create EO Observation</button>
      </div>
    </div>
    <div>
      <label>Selected acquisition</label>
      <div id="s1SelectedAcq" class="notice">No acquisition selected.</div>
    </div>
  </div>

  <div class="grid g3" style="margin-top:16px;">
    <div>
      <label for="s1From">From</label>
      <input id="s1From" type="datetime-local">
    </div>
    <div>
      <label for="s1To">To</label>
      <input id="s1To" type="datetime-local">
    </div>
    <div>
      <label for="s1Coeff">Backscatter coefficient</label>
      <input id="s1Coeff" type="number" step="0.01" value="1">
    </div>
    <div>
      <label for="s1Resolution">Resolution (m)</label>
      <input id="s1Resolution" type="number" min="10" step="10" value="10">
    </div>
    <div>
      <label for="s1Agg">Aggregation</label>
      <input id="s1Agg" type="text" value="P1D">
    </div>
    <div>
      <label for="s1Orbit">Orbit</label>
      <input id="s1Orbit" type="text" value="" placeholder="optional">
    </div>
    <div>
      <label for="s1Pol">Polarization</label>
      <input id="s1Pol" type="text" value="VV" placeholder="VV/VH">
    </div>
    <div>
      <label>&nbsp;</label>
      <div class="actions" style="margin-top:0;">
        <button id="s1LoadBtn" class="btn" type="button">Load Selected Acquisition</button>
      </div>
    </div>
    <div>
      <label>&nbsp;</label>
      <div class="actions" style="margin-top:0;">
        <button id="s1BuildBtn" class="btn secondary" type="button">Build Request</button>
      </div>
    </div>
  </div>

  <div class="actions" style="margin-top:12px;">
    <button id="s1SimBtn" class="btn danger" type="button">Simulate Sentinel-1 Statistics</button>
  </div>

  <div class="grid g2" style="margin-top:14px;">
    <div>
      <label>Request JSON</label>
      <pre id="s1Request" style="margin:0;white-space:pre-wrap;background:#f6f8f6;padding:12px;border:1px solid #dce5df;border-radius:8px;min-height:120px;overflow:auto;">{}</pre>
    </div>
    <div>
      <label>Status</label>
      <div id="s1Status" class="notice warning">Awaiting selection.</div>
    </div>
  </div>

  <div style="margin-top:14px;">
    <label>Output</label>
    <div id="s1Output" class="notice warning">No result yet.</div>
  </div>
</div>

<script>
(function(){
  const byId = id => document.getElementById(id);

  function ensureSampleAcquisitionData(){
    const ok = window.ANVORA_LIVE_ACQUISITIONS &&
      window.ANVORA_LIVE_ACQUISITIONS.response &&
      Array.isArray(window.ANVORA_LIVE_ACQUISITIONS.response.items) &&
      window.ANVORA_LIVE_ACQUISITIONS.response.items.length;
    if (ok) return;

    const now = new Date();
    const iso = new Date(now.getTime() - 45 * 60 * 1000).toISOString();
    window.ANVORA_LIVE_ACQUISITIONS = {
      request: { collection: 'sentinel-1-grd', bbox: [76.45, 15.24, 76.75, 15.53] },
      response: {
        items: [{
          id: 'SAMPLE-ACQ-001',
          datetime: iso,
          collection: 'sentinel-1-grd',
          bbox: [76.45, 15.24, 76.75, 15.53],
          self: 'sample://local-acquisition/SAMPLE-ACQ-001',
          href: 'sample://local-acquisition/SAMPLE-ACQ-001'
        }]
      }
    };
  }

  function renderEOAcqList(){
    const host = byId('eoAcqList');
    if (!host) return;
    const items = (window.ANVORA_LIVE_ACQUISITIONS && window.ANVORA_LIVE_ACQUISITIONS.response && Array.isArray(window.ANVORA_LIVE_ACQUISITIONS.response.items)) ? window.ANVORA_LIVE_ACQUISITIONS.response.items : [];
    if (!items.length) {
      host.innerHTML = '<div class="muted">No acquisition data loaded yet. Use the existing EO discovery flow to populate the list.</div>';
      return;
    }

    host.innerHTML = items.map((item, idx) => {
      const datetime = item.datetime || new Date().toISOString();
      const checked = idx === 0 ? 'checked' : '';
      return '<label style="display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer;">' +
        '<input type="radio" name="eoAcqSelect" value="' + (item.id || idx) + '" ' + checked + '>' +
        '<span><strong>' + (item.id || 'Acquisition ' + (idx + 1)) + '</strong><br><small>' + datetime + '</small></span>' +
        '</label>';
    }).join('');
  }

  function renderSelectedAcquisitionSummary(){
    const box = byId('s1SelectedAcq');
    if (!box) return;
    const observation = window.ANVORA_EO_OBSERVATION;
    if (!observation || !observation.acquisitionId) {
      box.innerHTML = '<div class="control-row"><div><b>No observation selected</b><small>Create an EO observation to populate the selected acquisition.</small></div><span class="pill warn">Needs observation</span></div>';
      return;
    }
    box.innerHTML = '<div class="control-row"><div><b>Selected acquisition</b><small>' + String(observation.acquisitionId || '—') + ' · ' + String(observation.acquisitionDateTime || '—') + '</small></div><span class="pill">Linked</span></div>';
  }

  function bindButtons(){
    const createBtn = byId('s1CreateObservationBtn');
    const loadBtn = byId('s1LoadBtn');
    const buildBtn = byId('s1BuildBtn');
    const simBtn = byId('s1SimBtn');

    if (createBtn) {
      createBtn.addEventListener('click', function(){
        if (typeof window.createEOObservation === 'function') {
          window.createEOObservation();
          renderSelectedAcquisitionSummary();
        } else {
          const status = byId('s1Status');
          if (status) status.innerHTML = '<div class="control-row"><div><b>EO creation unavailable</b><small>window.createEOObservation() is not defined.</small></div><span class="pill warn">Review</span></div>';
        }
      });
    }

    if (loadBtn) {
      loadBtn.addEventListener('click', function(){
        try {
          if (typeof window.loadSelectedAcqIntoS1 === 'function') {
            window.loadSelectedAcqIntoS1();
            renderSelectedAcquisitionSummary();
          } else {
            throw new Error('window.loadSelectedAcqIntoS1 is not defined');
          }
        } catch (err) {
          const status = byId('s1Status');
          if (status) status.innerHTML = '<div class="control-row"><div><b>Load failed</b><small>' + String(err && err.message ? err.message : err) + '</small></div><span class="pill bad">Review</span></div>';
        }
      });
    }

    if (buildBtn) {
      buildBtn.addEventListener('click', function(){
        try {
          if (typeof window.buildS1StatsRequest === 'function') {
            const req = window.buildS1StatsRequest();
            if (byId('s1Request')) byId('s1Request').textContent = JSON.stringify(req, null, 2);
          } else {
            throw new Error('window.buildS1StatsRequest is not defined');
          }
        } catch (err) {
          const status = byId('s1Status');
          if (status) status.innerHTML = '<div class="control-row"><div><b>Request build failed</b><small>' + String(err && err.message ? err.message : err) + '</small></div><span class="pill bad">Review</span></div>';
        }
      });
    }

    if (simBtn) {
      simBtn.addEventListener('click', function(){
        try {
          if (typeof window.simulateS1Stats === 'function') {
            window.simulateS1Stats();
          } else {
            throw new Error('window.simulateS1Stats is not defined');
          }
        } catch (err) {
          const status = byId('s1Status');
          if (status) status.innerHTML = '<div class="control-row"><div><b>Simulation failed</b><small>' + String(err && err.message ? err.message : err) + '</small></div><span class="pill bad">Review</span></div>';
        }
      });
    }
  }

  function install(){
    ensureSampleAcquisitionData();
    renderEOAcqList();
    bindButtons();
    renderSelectedAcquisitionSummary();
    if (byId('s1Status')) {
      byId('s1Status').innerHTML = '<div class="control-row"><div><b>Ready</b><small>Choose an acquisition, create an EO observation, and then load the Sentinel-1 window.</small></div><span class="pill">Ready</span></div>';
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', install);
  } else {
    install();
  }
})();
</script>
