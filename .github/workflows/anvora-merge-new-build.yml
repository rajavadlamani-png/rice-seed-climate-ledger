name: ANVORA merge new build features

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  merge:
    if: github.event.head_commit.message != 'ANVORA merge new build features'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge non-destructive evidence UX into original application
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'ANVORA-MERGED-EVIDENCE-UX-v1'
          if marker in s:
              raise SystemExit('Already merged')

          css = r'''\n<style id="anvora-merged-evidence-css">\n/* ANVORA-MERGED-EVIDENCE-UX-v1: additive UX only; original application remains intact. */\n#observationReview .or-hero{background:linear-gradient(135deg,#123e32,#176b52);color:#fff;border-radius:18px;padding:26px 30px;margin-bottom:16px}\n#observationReview .or-hero h1{color:#fff;margin:0 0 7px;font-size:30px}\n#observationReview .or-hero p{margin:0;max-width:850px;opacity:.9}\n#observationReview .or-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}\n#observationReview .or-card{background:#fff;border:1px solid #dce7e2;border-radius:14px;padding:18px;box-shadow:0 5px 20px rgba(18,52,42,.06);margin-bottom:16px}\n#observationReview .or-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#176b52;font-weight:850;margin-bottom:6px}\n#observationReview .or-status{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid #edf1ef}\n#observationReview .or-status:last-child{border-bottom:0}\n#observationReview .or-pill{display:inline-block;border-radius:999px;padding:5px 9px;background:#e4f2ec;color:#176b52;font-size:11px;font-weight:800}\n#observationReview .or-pill.warn{background:#fff4dc;color:#8a5a00}\n#observationReview .or-pill.bad{background:#fff0ee;color:#a33a32}\n#observationReview .or-result{font-size:18px;line-height:1.45}\n#observationReview .or-result strong{color:#176b52}\n#observationReview .or-image{width:100%;max-height:430px;object-fit:contain;background:#edf2f0;border:1px solid #dce7e2;border-radius:10px;display:block}\n#observationReview .or-note{padding:12px 14px;background:#eef7f3;border-left:4px solid #176b52;border-radius:8px;margin-top:12px}\n#observationReview .or-note.warn{background:#fff8e9;border-color:#d89c2b}\n#observationReview details{border:1px solid #dce7e2;border-radius:10px;background:#fafcfb;padding:10px 12px;margin-top:12px}\n#observationReview pre{white-space:pre-wrap;overflow:auto;max-height:360px;background:#f6f8f6;border:1px solid #dce7e2;border-radius:9px;padding:12px;font-size:12px}\n#observationReview .or-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}\n#observationReview button{border:1px solid #d5e1dc;background:#edf3f0;color:#17302a;border-radius:8px;padding:9px 13px;font-weight:700;cursor:pointer}\n#observationReview button.primary{background:#176b52;color:#fff;border:0}\n#observationReview .or-empty{padding:28px;text-align:center;color:#687a74}\n@media(max-width:900px){#observationReview .or-grid{grid-template-columns:1fr}}\n</style>\n'''

          section = r'''\n<section id="observationReview" class="page">\n  <div class="or-hero">\n    <div class="or-kicker" style="color:#9fe0c7">ANVORA · OBSERVATION REVIEW</div>\n    <h1>What did the field evidence actually show?</h1>\n    <p>This is the plain-language result screen. It separates a real satellite acquisition, measured radar evidence and a validated farm event. A practice is never declared from metadata alone.</p>\n  </div>\n  <div id="orMain">\n    <div class="or-card or-empty">Select a live acquisition in <b>Remote Evidence</b>, create the observation record, and then return here.</div>\n  </div>\n</section>\n'''

          js = r'''\n<script id="anvora-merged-evidence-js">\n/* ANVORA-MERGED-EVIDENCE-UX-v1 */\n(function(){\n  const MARK='ANVORA-MERGED-EVIDENCE-UX-v1';\n  function by(id){return document.getElementById(id)}\n  function safeEsc(v){return typeof esc==='function'?esc(v):String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}\n  function selectedItem(){\n    try{const live=window.ANVORA_LIVE_ACQUISITIONS,items=live?.response?.items||[];const rs=[...document.querySelectorAll('input[name="eoAcqSelect"]')];const i=Math.max(0,rs.findIndex(r=>r.checked));return items[i]||items[0]||null}catch(e){return null}\n  }\n  function imageAsset(item){\n    const a=item?.assets||{};\n    const preferred=['thumbnail','visual','rendered_preview','browse','quicklook','overview'];\n    for(const k of preferred){if(a[k]?.href && /^https?:/i.test(a[k].href)) return {href:a[k].href,key:k,type:a[k].type||''}}\n    for(const k of Object.keys(a)){const v=a[k];if(v?.href && /^https?:/i.test(v.href) && /image|preview|thumbnail|browse|quicklook/i.test((k+' '+(v.type||'')))) return {href:v.href,key:k,type:v.type||''}}\n    return null\n  }\n  function getStats(){\n    const r=window.ANVORA_S1_RESULT,d=r?.data||r,ints=Array.isArray(d?.data)?d.data:[],out=[];\n    ints.forEach(it=>{const bands=it?.outputs?.backscatter?.bands||{};Object.keys(bands).forEach(k=>{const st=bands[k]?.stats;if(st)out.push({band:k,mean:Number(st.mean),sd:Number(st.stDev),n:Number(st.sampleCount),from:it.interval?.from,to:it.interval?.to})})});\n    return out;\n  }\n  function render(){\n    const box=by('orMain');if(!box)return;\n    const o=window.ANVORA_EO_OBSERVATION||null;\n    const item=selectedItem();\n    const result=window.ANVORA_S1_RESULT;\n    const measured=!!result&&!result.simulated;\n    if(!o){box.innerHTML='<div class="or-card or-empty">No observation is selected yet. Go to <b>Remote Evidence</b>, run live acquisition discovery and create an observation record.</div>';return}\n    const stats=getStats();\n    const img=o.evidenceImage||imageAsset(item);\n    const statText=stats.length?stats.map(x=>safeEsc(x.band)+' mean '+Number.isFinite(x.mean)?Number(x.mean).toFixed(5):'—').join(' · '):'No measured SAR statistics yet';\n    let imageHtml=img?'<img class="or-image" src="'+safeEsc(img.href)+'" alt="Provider asset from selected Sentinel acquisition"><p class="muted" style="margin-top:7px">Source asset: '+safeEsc(img.key||'provider asset')+'. This is provider imagery/asset content; it is evidence of the acquisition context, not by itself proof of a farm practice.</p>':'<div class="or-note warn"><b>No usable provider image asset was returned for this acquisition.</b><br>ANVORA will not substitute a decorative or fabricated image.</div>';\n    let headline,detail,practice='Not assessed';\n    if(measured){\n      headline='Measured satellite evidence is available.';\n      detail='The selected Sentinel-1 acquisition has produced numerical radar statistics for the requested area and time. This is a measured observation, not yet a validated farm-practice event.';\n      practice='Pending event validation';\n    }else{\n      headline='The satellite scene is confirmed, but measurement is not yet complete.';\n      detail='The catalogue confirms the acquisition and its spatial/temporal context. ANVORA cannot call this drainage, moisture change, AWD or fertiliser application until authenticated processing and the corresponding validation rule succeed.';\n    }\n    box.innerHTML='<div class="or-grid">'+\n      '<div>'+\n        '<div class="or-card"><div class="or-kicker">PLAIN-LANGUAGE RESULT</div><div class="or-result"><strong>'+headline+'</strong></div><p class="muted">'+detail+'</p><div class="or-actions"><button class="primary" onclick="showPage(\'connectors\')">Open remote processing</button><button onclick="showPage(\'remoteEvidence\')">Return to acquisition</button></div></div>'+\n        '<div class="or-card"><div class="or-kicker">EVIDENCE PICTURE</div>'+imageHtml+'</div>'+\n      '</div>'+\n      '<div>'+\n        '<div class="or-card"><div class="or-kicker">WHAT IS SUPPORTED</div>'+\n          '<div class="or-status"><div><b>Scene</b><br><small>Acquisition exists in the live catalogue.</small></div><span class="or-pill">Confirmed</span></div>'+\n          '<div class="or-status"><div><b>Plot match</b><br><small>Returned catalogue footprint compared with requested plot area.</small></div><span class="or-pill">'+safeEsc(o.spatialMatch||'Not assessed')+'</span></div>'+\n          '<div class="or-status"><div><b>Measured radar signal</b><br><small>'+safeEsc(stats.length?stats.map(x=>x.band+': '+(Number.isFinite(x.mean)?x.mean.toFixed(5):'—')).join(' · '):'No measurement returned')+'</small></div><span class="or-pill '+(measured?'':'warn')+'">'+(measured?'Measured':'Pending')+'</span></div>'+\n          '<div class="or-status"><div><b>Farm practice</b><br><small>Drainage, moisture, AWD, irrigation or fertiliser requires a validated event rule.</small></div><span class="or-pill warn">'+practice+'</span></div>'+\n        '</div>'+\n        '<div class="or-card"><div class="or-kicker">PROVENANCE</div>'+\n          '<div class="or-status"><div><b>Observation ID</b><br><small>'+safeEsc(o.observationId)+'</small></div><span class="or-pill">Recorded</span></div>'+\n          '<div class="or-status"><div><b>Acquisition</b><br><small>'+safeEsc(o.acquisitionId)+'</small></div><span class="or-pill">Recorded</span></div>'+\n          '<div class="or-status"><div><b>Processing</b><br><small>'+safeEsc(measured?'Measured':'METADATA_ONLY')+'</small></div><span class="or-pill '+(measured?'':'warn')+'">'+(measured?'Measured':'Metadata')+'</span></div>'+\n          '<details><summary>Technical evidence record</summary><pre>'+safeEsc(JSON.stringify({...o,processingResult:result||null,evidenceImage:img||null},null,2))+'</pre></details>'+\n        '</div>'+\n      '</div>'+\n    '</div>';\n  }\n  function enrichObservation(){\n    const o=window.ANVORA_EO_OBSERVATION;if(!o)return;const img=imageAsset(selectedItem());if(img)o.evidenceImage=img.href;o.evidenceAssetKey=img?.key||null;o.evidenceAssetType=img?.type||null;\n    const r=window.ANVORA_S1_RESULT;if(r&&!r.simulated){o.processingStatus='PROCESSED';o.derivedMetrics=r.data?.data||r.data?.derivedMetrics||[];o.practiceSignal='Not assessed';o.algorithmVersion='ANVORA-EO-S1-0.1';o.assuranceNote='Measured Sentinel-1 statistics are available. No farm practice is declared without a separately validated temporal event rule and corroborating evidence.'}\n  }\n  function openReview(){enrichObservation();render();showPageBase('observationReview')}\n  const showPageBase=window.showPage;\n  if(typeof showPageBase==='function'){\n    window.showPage=function(id){\n      // Always restore navigation. The previous connector POC intentionally hid it; that behavior is retired.\n      document.body.classList.remove('poc-connectors-active');\n      const r=showPageBase.apply(this,arguments);\n      setTimeout(()=>{document.body.classList.remove('poc-connectors-active');if(id==='observationReview')render()},20);\n      return r;\n    };\n  }\n  const oldCreate=window.createEOObservation;\n  if(typeof oldCreate==='function'){\n    window.createEOObservation=function(){const r=oldCreate.apply(this,arguments);setTimeout(()=>{enrichObservation();render()},30);return r};\n  }\n  const oldRun=window.runS1Backend;\n  if(typeof oldRun==='function'){\n    window.runS1Backend=async function(){const r=await oldRun.apply(this,arguments);setTimeout(()=>{enrichObservation();render()},50);return r};\n  }\n  window.openANVORAObservationReview=openReview;\n  window.addEventListener('load',()=>{setTimeout(()=>{document.body.classList.remove('poc-connectors-active');render()},120)});\n})();\n</script>\n'''

          nav_marker = '<button data-page="remoteEvidence">Remote Evidence</button>'
          if nav_marker in s:
              s = s.replace(nav_marker, '<button data-page="observationReview">Observation Review</button>'+nav_marker, 1)
          else:
              raise SystemExit('Remote Evidence navigation marker not found')

          s = s.replace('</head>', css + '</head>', 1)
          s = s.replace('</main>', section + '</main>', 1)
          s = s.replace('</body>', js + '</body>', 1)

          # Make the additive page reachable and ensure the original sidebar never disappears.
          s = s.replace("if(id==='remoteEvidence')safeCall(renderRemoteEvidence);", "if(id==='remoteEvidence')safeCall(renderRemoteEvidence);\n  if(id==='observationReview')safeCall(()=>window.openANVORAObservationReview?.());", 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit merged application and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/anvora-merge-new-build.yml
          git add index.html .github/workflows/anvora-merge-new-build.yml
          git commit -m "ANVORA merge new build features"
          git push
