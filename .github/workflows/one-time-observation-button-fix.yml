name: One-time observation button fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply one-time observation button robustness fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch observation button
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'id="anvora-observation-button-robustness"'
          if marker in s:
              print('Observation robustness patch already present')
              raise SystemExit(0)
          patch = r'''\n<script id="anvora-observation-button-robustness">\n(function(){\n  function by(id){return document.getElementById(id)}\n  function makeObservationButtonUsable(){\n    document.querySelectorAll('button[onclick="createEOObservation()"]').forEach(function(btn){\n      btn.disabled=false;\n      btn.removeAttribute('aria-disabled');\n      btn.style.pointerEvents='auto';\n      btn.style.opacity='1';\n      btn.title='Create an observation record from the selected live acquisition';\n    });\n  }\n  window.createEOObservation=function(){\n    try{\n      const live=window.ANVORA_LIVE_ACQUISITIONS;\n      const items=live && live.response && Array.isArray(live.response.items) ? live.response.items : [];\n      if(!items.length){\n        const status=by('acqStatus');\n        if(status) status.innerHTML='<div class="control-row"><div><b>No live acquisition is loaded</b><small>Run “Discover live acquisitions” first. The observation button is available and will guide you here.</small></div><span class="pill warn">Needs acquisition</span></div>';\n        alert('Please run “Discover live acquisitions” first, then select an acquisition.');\n        return false;\n      }\n      const radios=Array.from(document.querySelectorAll('input[name="eoAcqSelect"]'));\n      let idx=radios.findIndex(function(r){return r.checked;});\n      if(idx<0 || !items[idx]) idx=0;\n      if(radios[idx]) radios[idx].checked=true;\n      const item=items[idx];\n      const p=typeof acqPayload==='function' ? acqPayload() : {plotId:'UNASSIGNED',bbox:null};\n      const bbox=item.bbox || null;\n      const spatial=(typeof bboxIntersects==='function' && bbox && p.bbox) ? bboxIntersects(bbox,p.bbox) : null;\n      const dt=item.datetime || null;\n      const observation={\n        observationId:'EO-'+Date.now().toString(36).toUpperCase(),\n        plotId:p.plotId || 'UNASSIGNED',\n        source:'Copernicus Data Space',\n        mission:(p.collection||'sentinel-1-grd').includes('sentinel-1')?'Sentinel-1':'Sentinel-2',\n        productCollection:p.collection || 'sentinel-1-grd',\n        acquisitionId:item.id || null,\n        acquisitionDateTime:dt,\n        stacItemUrl:item.self || item.href || null,\n        requestedBbox:p.bbox || null,\n        catalogueBbox:bbox,\n        spatialMatch:spatial===null?'Not assessed':(spatial?'Consistent':'Review'),\n        temporalMatch:dt?'Confirmed':'Not assessed',\n        practiceSignal:'Not assessed',\n        derivedMetrics:[],\n        processingStatus:'METADATA_ONLY',\n        algorithmVersion:'ANVORA-EO-META-0.2',\n        createdAt:new Date().toISOString(),\n        provenance:{catalogueEndpoint:(typeof CDSE_STAC!=='undefined'?CDSE_STAC:'https://stac.dataspace.copernicus.eu/v1')+'/search',request:live.request||null,sourceRecord:'Live STAC acquisition metadata'},\n        assuranceNote:'Catalogue metadata confirms an acquisition context; it does not by itself prove wet/dry conditions, AWD events, irrigation practice or farmer action.'\n      };\n      window.ANVORA_EO_OBSERVATION=observation;\n      if(by('eoAcqId')) by('eoAcqId').textContent=(item.id||'—').slice(0,24)+(item.id && item.id.length>24?'…':'');\n      if(by('eoSpatial')) by('eoSpatial').textContent=observation.spatialMatch;\n      if(by('eoTemporal')) by('eoTemporal').textContent=observation.temporalMatch;\n      if(by('eoPractice')) by('eoPractice').textContent='Not assessed';\n      if(by('eoRecord')) by('eoRecord').innerHTML=[['Observation ID',observation.observationId],['Plot',observation.plotId],['Acquisition',observation.acquisitionId],['Acquired',typeof fmtDate==='function'?fmtDate(observation.acquisitionDateTime):observation.acquisitionDateTime],['Processing',observation.processingStatus],['Algorithm',observation.algorithmVersion]].map(function(x){return '<div class="control-row"><div><b>'+esc(x[0])+'</b><small>'+esc(x[1]||'—')+'</small></div><span class="pill">Recorded</span></div>';}).join('');\n      if(by('eoQuality')) by('eoQuality').innerHTML='<div class="control-row"><div><b>Spatial catalogue match</b><small>'+esc(observation.spatialMatch)+' · returned STAC footprint/bbox compared with the requested plot.</small></div><span class="pill">'+esc(observation.spatialMatch)+'</span></div><div class="control-row"><div><b>Practice inference</b><small>Wet/dry, AWD and drainage signals remain unassessed until authenticated imagery processing and validation are completed.</small></div><span class="pill">Not assessed</span></div><div class="control-row"><div><b>Evidence class</b><small>Live acquisition metadata; not independent practice verification.</small></div><span class="pill">Metadata</span></div>';\n      if(by('eoJson')) by('eoJson').textContent=JSON.stringify(observation,null,2);\n      const review=by('orMain');\n      if(review && typeof window.openANVORAObservationReview==='function') window.openANVORAObservationReview();\n      makeObservationButtonUsable();\n      return false;\n    }catch(err){\n      console.error('ANVORA observation record error',err);\n      alert('Observation record could not be created: '+(err && err.message ? err.message : String(err)));\n      return false;\n    }\n  };\n  window.addEventListener('load',makeObservationButtonUsable);\n  document.addEventListener('click',function(e){\n    if(e.target && e.target.matches('button[onclick="createEOObservation()"]')) makeObservationButtonUsable();\n  },true);\n})();\n</script>\n'''
          if '</body>' in s:
              s = s.replace('</body>', patch + '</body>', 1)
          else:
              s += patch
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Apply one-time observation button robustness fix"
          git push
