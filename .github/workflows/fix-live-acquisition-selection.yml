name: Fix live acquisition selection state

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix live acquisition selection state'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch acquisition state handling
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old1 = "const live=window.ANVORA_LIVE_ACQUISITIONS;\n  if(!live || !Array.isArray(live.items) || !live.items.length) return null;\n  const radios=[...document.querySelectorAll('input[name=\"eoAcqSelect\"]')];\n  const idx=Math.max(0,radios.findIndex(r=>r.checked));\n  return live.items[idx]||live.items[0]||null;"
          new1 = "const live=window.ANVORA_LIVE_ACQUISITIONS;\n  const items=live?.response?.items;\n  if(!live || !Array.isArray(items) || !items.length) return null;\n  const radios=[...document.querySelectorAll('input[name=\"eoAcqSelect\"]')];\n  const idx=Math.max(0,radios.findIndex(r=>r.checked));\n  return items[idx]||items[0]||null;"

          old2 = "const live=window.ANVORA_LIVE_ACQUISITIONS; if(!live||!live.items||!live.items[idx]) return;\n  const item=live.items[idx];"
          new2 = "const live=window.ANVORA_LIVE_ACQUISITIONS; const items=live?.response?.items; if(!live||!items||!items[idx]) return;\n  const item=items[idx];"

          if old1 not in s:
              raise SystemExit('Expected selectedEOItem code was not found; no change made.')
          if old2 not in s:
              raise SystemExit('Expected previewEOSelection code was not found; no change made.')

          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-live-acquisition-selection.yml
          git commit -m "Fix live acquisition selection state"
          git rm .github/workflows/fix-live-acquisition-selection.yml
          git commit -m "Remove temporary acquisition fix workflow"
          git push
