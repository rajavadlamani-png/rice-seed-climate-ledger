name: Integrate ANVORA observation evidence layer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message != 'Integrate ANVORA observation evidence layer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate evidence module
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./anvora-observation-evidence-v1.js"></script>'
          if tag not in s:
              marker='</head>'
              if marker not in s:
                  raise SystemExit('No </head> marker found; no change made.')
              s=s.replace(marker,tag+'\n'+marker,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/integrate-observation-evidence.yml
          git commit -m "Integrate ANVORA observation evidence layer"
          git rm .github/workflows/integrate-observation-evidence.yml
          git commit -m "Remove temporary evidence integration workflow"
          git push
