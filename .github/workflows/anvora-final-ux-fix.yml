name: ANVORA final UX fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'ANVORA final UX fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch original ANVORA safely
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "  if(id==='observationReview')safeCall(()=>window.openANVORAObservationReview?.());\n"
          if old in s:
              s = s.replace(old, '')
          if 'function renderEvidenceVisual(stats)' not in s:
              visual = '''function renderEvidenceVisual(stats){
              const c=document.getElementById('orEvidenceCanvas'); if(!c||!stats.length)return;
              const w=Math.max(420,c.clientWidth||700),h=220,dpr=window.devicePixelRatio||1;c.width=w*dpr;c.height=h*dpr;
              const g=c.getContext('2d');g.scale(dpr,dpr);g.clearRect(0,0,w,h);
              const vals=stats.map(x=>Number(x.mean)).filter(Number.isFinite);if(!vals.length)return;
              const lo=Math.min(...vals),hi=Math.max(...vals),span=Math.max(.0001,hi-lo),base=h-42;
              g.strokeStyle='#dce7e2';g.beginPath();g.moveTo(40,base);g.lineTo(w-18,base);g.stroke();
              const bw=Math.min(120,(w-80)/Math.max(1,stats.length)-18);
              stats.forEach((x,i)=>{const v=Number(x.mean);const bh=28+(v-lo)/span*105,xx=52+i*(bw+18),yy=base-bh;g.fillStyle='#176b52';g.fillRect(xx,yy,bw,bh);g.fillStyle='#17302a';g.font='700 12px system-ui';g.textAlign='center';g.fillText(String(x.band||'SAR'),xx+bw/2,base+19);g.font='11px system-ui';g.fillText(Number.isFinite(v)?v.toFixed(4):'—',xx+bw/2,yy-7)});
              g.textAlign='left';g.fillStyle='#61736d';g.font='11px system-ui';g.fillText('Measured Sentinel-1 backscatter mean · evidence visualization',40,18);
            }
            '''
              s = s.replace('function render(){', visual + 'function render(){', 1)
          target = '<div class="or-card"><div class="or-kicker">EVIDENCE PICTURE</div>'+imageHtml+'</div>'
          replacement = '<div class="or-card"><div class="or-kicker">EVIDENCE PICTURE</div>'+imageHtml+'<div class="or-visual" style="margin-top:12px"><b>Measured evidence visualization</b><p class="muted" style="margin:4px 0 8px">If the provider does not expose a browser-displayable thumbnail, ANVORA shows the measured SAR statistics here instead. This is not a substitute satellite image.</p><canvas id="orEvidenceCanvas" style="width:100%;height:220px;display:block"></canvas></div></div>'
          if target in s:
              s = s.replace(target, replacement, 1)
          else:
              raise SystemExit('Evidence picture marker not found')
          needle = "    '</div>';\n  }\n  function enrichObservation()"
          if needle in s and 'renderEvidenceVisual(stats);' not in s:
              s = s.replace(needle, "    '</div>';\n    renderEvidenceVisual(stats);\n  }\n  function enrichObservation()", 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/anvora-final-ux-fix.yml
          git add index.html .github/workflows/anvora-final-ux-fix.yml
          git commit -m "ANVORA final UX fix"
          git push
